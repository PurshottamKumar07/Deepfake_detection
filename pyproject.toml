[project]
name = "final-year-projet"
version = "0.1.0"
description = "AI-Powered Digital Media Forensics and Deepfake Detection System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "facenet-pytorch>=2.5.3",
    "fastapi>=0.115.0",
    "grad-cam>=1.5.7",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "transformers>=4.51.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
